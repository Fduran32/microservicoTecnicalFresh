server.port=${PORT:8081}
spring.application.name=microservicioTecnico
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:db_tecnico}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true